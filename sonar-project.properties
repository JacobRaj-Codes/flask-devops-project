# SonarCloud project settings
# Replace YOUR_SONARCLOUD_ORG and YOUR_PROJECT_KEY with your own values
# (You'll get these when you create the project on sonarcloud.io)

sonar.organization=jacobraj-codes
sonar.projectKey=JacobRaj-Codes_flask-devops-project

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# Point SonarCloud at the coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Exclude generated/non-source files from analysis
sonar.exclusions=**/__pycache__/**,**/.venv/**
